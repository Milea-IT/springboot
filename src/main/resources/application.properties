spring.application.name=SpringBootLT01K16

#Cấu hình kết nối đến DB, nếu chưa có DB sẽ tự động tạo
spring.datasource.url=jdbc:mysql://localhost:3306/mobilestore?useSSL=false&serverTimezone=UTC
#Cấu hình username, password
spring.datasource.username=root
spring.datasource.password=
#Drive MySQL 8+
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Cấu hình DDL tự động tạo hoặc cập nhật bảng
spring.jpa.hibernate.ddl-auto=update

# Hiển thị câu lệnh SQL ra màn hình Console khi chạy ứng dụng để tiện quan sát
spring.jpa.show-sql=true